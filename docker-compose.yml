services:
  hufly_db:
    image: mongo:latest
    #restart: unless-stopped
    logging:
      driver: none
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    volumes:
      - ./mongodb_data:/data/db
    networks:
      - spring-mongo-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Local development only: no basic auth. Enable ME_CONFIG_BASICAUTH with credentials before exposing it anywhere.
  hufly_db_gui:
    image: mongo-express:latest
    #restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@hufly_db:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - hufly_db
    networks:
      - spring-mongo-network

  hufly_server:
    build:
      context: .
      dockerfile: Dockerfile
    #restart: unless-stopped
    depends_on:
      hufly_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@hufly_db:27017/hufly?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_STABLE_NAME: ${BOOTSTRAP_STABLE_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    networks:
      - spring-mongo-network

networks:
  spring-mongo-network:
    driver: bridge
