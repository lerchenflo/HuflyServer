spring.mongodb.uri=mongodb://localhost:27017/hufly-test
spring.mongodb.database=hufly-test
#No Mongo instance in unit test runs; indexes get created on the real server at startup
spring.data.mongodb.auto-index-creation=false
jwt.secret=test-secret-that-is-long-enough-for-hs256-signing

#Operator area closed by default; tests that need it set their own path and credentials
operator.path=/operator-not-configured

#High limits so ordinary tests never trip the brute-force protection; LoginRateLimitTest sets low ones
ratelimit.login.max-failures-per-email=1000
ratelimit.login.max-failures-per-ip=1000
ratelimit.operator.max-failures-per-ip=1000

#Spring tests use FakePictureStore; FilePictureStoreTest uses its own temp directory
pictures.dir=build/test-pictures

#The website shows this contact address (production sets CONTACT_EMAIL)
website.contact-email=test-contact@example.org
website.imprint-name=Anna <Test> & Co
website.imprint-street=Teststra\u00dfe 1
website.imprint-city=6900 Bregenz
