spring.application.name=hufly-server

#logging
#Colored like SchneaggchatV3server's AppLogger (gray time, INFO green, WARN yellow, ERROR red), also without a TTY (docker logs)
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5p) %clr(%logger{0}){cyan} - %m%n%wEx
#Only our own logs and the port; libraries (Mongo client settings, STOMP stats, Pushy SSL) only when something goes wrong
logging.level.root=WARN
logging.level.com.lerchenflo=INFO
logging.level.org.springframework.boot.tomcat.TomcatWebServer=INFO

#Always print the error message in the response
spring.web.error.include-message=always

#Mongodb
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/hufly}
spring.mongodb.database=hufly
spring.data.mongodb.auto-index-creation=true

#Json web token (HS256, needs at least 32 bytes)
jwt.secret=${JWT_SECRET}

#Local first stable until the onboarding website exists; does nothing unless all three are set
bootstrap.stable-name=${BOOTSTRAP_STABLE_NAME:}
bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

#Operator website (creates stables). Set an unguessable OPERATOR_PATH; without username and a 12+ char password it stays closed
operator.path=${OPERATOR_PATH:/operator-not-configured}
operator.username=${OPERATOR_USERNAME:}
operator.password=${OPERATOR_PASSWORD:}

#Brute-force protection: failed password logins per 15 minutes
ratelimit.login.max-failures-per-email=10
ratelimit.login.max-failures-per-ip=30
ratelimit.operator.max-failures-per-ip=5
#Behind a reverse proxy: trust X-Forwarded-For only from internal proxy addresses
server.forward-headers-strategy=native

#Contact address on the public website (required)
website.contact-email=${CONTACT_EMAIL:}

#Horse and profile pictures: one JPEG per entity on disk (Docker volume)
pictures.dir=${PICTURES_DIR:./data/pictures}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#Push notifications; each platform stays off until configured
push.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}
push.apns.key-file=${APNS_KEY_FILE:}
push.apns.team-id=${APNS_TEAM_ID:}
push.apns.key-id=${APNS_KEY_ID:}
push.apns.bundle-id=${APNS_BUNDLE_ID:}
push.apns.production=${APNS_PRODUCTION:false}
