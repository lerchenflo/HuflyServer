spring.application.name=hufly-server

#logging
logging.pattern.console=%d{HH:mm:ss} %p %c - %m%n

#Always print the error message in the response
spring.web.error.include-message=always

#Mongodb
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/hufly}
spring.mongodb.database=hufly
spring.data.mongodb.auto-index-creation=true

#Json web token (HS256, needs at least 32 bytes)
jwt.secret=${JWT_SECRET}
