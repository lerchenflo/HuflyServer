<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Hufly Ställe</title>
<style>
/* Material 3 baseline colours, the same scheme the Hufly app uses (lightColorScheme / darkColorScheme). */
:root {
  --primary: #6750A4; --on-primary: #FFFFFF;
  --primary-container: #EADDFF; --on-primary-container: #21005D;
  --surface: #FEF7FF; --surface-container: #F3EDF7; --on-surface: #1D1B20; --on-surface-variant: #49454F;
  --outline: #79747E; --outline-variant: #CAC4D0;
  --error: #B3261E; --error-container: #F9DEDC; --on-error-container: #410E0B;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #D0BCFF; --on-primary: #381E72;
    --primary-container: #4F378B; --on-primary-container: #EADDFF;
    --surface: #141218; --surface-container: #211F26; --on-surface: #E6E0E9; --on-surface-variant: #CAC4D0;
    --outline: #938F99; --outline-variant: #49454F;
    --error: #F2B8B5; --error-container: #8C1D18; --on-error-container: #F9DEDC;
  }
}
@font-face {
  font-family: "Bricolage Grotesque";
  src: url("/assets/fonts/bricolage-grotesque-latin.woff2") format("woff2");
  font-weight: 400 800;
  font-display: swap;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface); color: var(--on-surface);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { display: flex; align-items: center; gap: 12px; font: 700 30px/1.1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.02em; margin: 0 0 6px; }
h1 svg { width: 36px; height: 36px; flex: none; }
.subtitle { color: var(--on-surface-variant); margin: 0 0 32px; }
h2 { font: 600 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; margin: 0 0 16px; }
.card { background: var(--surface-container); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
form { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
label { display: grid; gap: 6px; font-size: 14px; color: var(--on-surface-variant); }
label.wide { grid-column: 1 / -1; }
input {
  font: inherit; color: var(--on-surface); background: transparent;
  border: 1px solid var(--outline); border-radius: 8px; padding: 12px 14px;
}
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
button {
  grid-column: 1 / -1; justify-self: start; font: inherit; font-weight: 500;
  background: var(--primary); color: var(--on-primary); border: 0; border-radius: 20px; padding: 10px 24px; cursor: pointer;
}
button:disabled { opacity: .5; cursor: default; }
.result { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; }
.result.ok { display: block; background: var(--primary-container); color: var(--on-primary-container); }
.result.err { display: block; background: var(--error-container); color: var(--on-error-container); }
.password {
  display: inline-block; margin-top: 8px; font: 600 20px/1.4 ui-monospace, Menlo, monospace;
  letter-spacing: .05em; user-select: all;
}
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 500; color: var(--on-surface-variant); font-size: 13px; padding: 0 12px 8px 0; }
td { border-top: 1px solid var(--outline-variant); padding: 10px 12px 10px 0; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 8px; border: 1px solid var(--outline); white-space: nowrap; }
.empty { color: var(--on-surface-variant); }
button.danger { background: transparent; color: var(--error, #BA1A1A); border: 1px solid currentColor; padding: 4px 14px; font-size: 14px; }
@media (max-width: 600px) {
  form { grid-template-columns: 1fr; }
  th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; }
}
</style>
</head>
<body>
<main>
  <h1><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#6750A4"/><path d="M19 14v18a13 13 0 0 0 26 0V14" fill="none" stroke="#EADDFF" stroke-width="8" stroke-linecap="round"/><g fill="#6750A4"><circle cx="19" cy="24" r="2.4"/><circle cx="45" cy="24" r="2.4"/><circle cx="22" cy="38" r="2.4"/><circle cx="42" cy="38" r="2.4"/></g></svg>Hufly Ställe</h1>
  <p class="subtitle">Ställe mit ihrem Admin anlegen und löschen.</p>

  <section class="card">
    <h2>Neuer Stall</h2>
    <form id="create">
      <label class="wide">Name des Stalls
        <input name="stableName" required maxlength="100" autocomplete="off">
      </label>
      <label>Name des Admins
        <input name="adminDisplayName" required maxlength="100" autocomplete="off">
      </label>
      <label>E-Mail des Admins
        <input name="adminEmail" type="email" required maxlength="254" autocomplete="off">
      </label>
      <button type="submit">Stall anlegen</button>
    </form>
    <div id="result" class="result" role="status"></div>
  </section>

  <section class="card">
    <h2>Ställe</h2>
    <table>
      <thead><tr><th>Stall</th><th>Admin</th><th>Abo</th><th>Angelegt</th><th></th></tr></thead>
      <tbody id="stables"><tr><td colspan="5" class="empty">Lädt …</td></tr></tbody>
    </table>
  </section>
</main>
<script>
const api = location.pathname.replace(/\/$/, '') + '/api/stables';
const statusText = { TRIAL: 'Testphase', ACTIVE: 'Aktiv', EXPIRED: 'Abgelaufen' };

function cell(text) {
  const td = document.createElement('td');
  td.textContent = text;
  return td;
}

function deleteCell(stable) {
  const td = cell('');
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'danger'; button.textContent = 'Löschen';
  button.addEventListener('click', async () => {
    if (!confirm(`Stall „${stable.name}“ wirklich löschen?\n\nAlle Benutzer, Pferde, Termine, Aufgaben und Bilder dieses Stalls werden endgültig entfernt.`)) return;
    const name = prompt('Zum Bestätigen den Namen des Stalls eingeben:');
    if (name === null) return;
    if (name !== stable.name) { alert('Name stimmt nicht überein. Nichts gelöscht.'); return; }
    if (!confirm(`Letzte Warnung: „${stable.name}“ jetzt endgültig löschen? Das kann nicht rückgängig gemacht werden.`)) return;
    button.disabled = true;
    const response = await fetch(`${api}/${stable.id}`, {
      method: 'DELETE', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmName: name })
    });
    if (!response.ok) { alert('Löschen fehlgeschlagen.'); button.disabled = false; return; }
    loadStables();
  });
  td.append(button);
  return td;
}

async function loadStables() {
  const body = document.getElementById('stables');
  const response = await fetch(api, { credentials: 'same-origin' });
  const stables = response.ok ? await response.json() : [];
  body.replaceChildren();
  if (stables.length === 0) {
    const row = document.createElement('tr');
    const td = cell(response.ok ? 'Noch keine Ställe.' : 'Laden fehlgeschlagen.');
    td.colSpan = 5; td.className = 'empty';
    row.append(td); body.append(row);
    return;
  }
  for (const stable of stables) {
    const row = document.createElement('tr');
    const status = cell('');
    const chip = document.createElement('span');
    chip.className = 'chip'; chip.textContent = statusText[stable.subscriptionStatus] ?? stable.subscriptionStatus;
    status.append(chip);
    row.append(cell(stable.name), cell(stable.adminEmail ?? '–'), status,
      cell(new Date(stable.createdAt).toLocaleDateString('de-AT')), deleteCell(stable));
    body.append(row);
  }
}

document.getElementById('create').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = event.target;
  const button = form.querySelector('button');
  const result = document.getElementById('result');
  button.disabled = true;
  result.className = 'result';
  try {
    const response = await fetch(api, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(form))),
    });
    result.replaceChildren();
    if (response.ok) {
      const created = await response.json();
      result.className = 'result ok';
      result.append(`Stall „${created.stableName}“ angelegt. Passwort für ${created.adminEmail} (wird nur jetzt angezeigt):`,
        document.createElement('br'));
      const password = document.createElement('span');
      password.className = 'password'; password.textContent = created.generatedPassword;
      result.append(password);
      form.reset();
      loadStables();
    } else {
      result.className = 'result err';
      result.textContent = response.status === 409 ? 'Diese E-Mail wird schon verwendet.'
        : response.status === 400 ? 'Bitte alle Felder richtig ausfüllen.' : `Fehler ${response.status}.`;
    }
  } finally {
    button.disabled = false;
  }
});

loadStables();
</script>
</body>
</html>
